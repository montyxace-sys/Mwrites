name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        shell: pwsh
        run: dotnet restore Mwrites.slnx

      - name: Compilar
        shell: pwsh
        run: dotnet build Mwrites.slnx --no-restore -c Release --warnaserror

      # Las pruebas son una aplicación de consola que devuelve 0 cuando todo pasa,
      # así que el propio dotnet run hace de puerta del CI.
      - name: Probar
        shell: pwsh
        run: dotnet run --project tests/Mwrites.CoreTests/Mwrites.CoreTests.csproj -c Release --no-build
