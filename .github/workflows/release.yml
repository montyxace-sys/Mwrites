name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and publish portable
        shell: pwsh
        run: |
          dotnet publish App/Mwrites.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Locate signtool
        id: signtool
        run: |
          $st = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $st) { Write-Host "signtool no encontrado"; exit 1 }
          echo "path=$st" >> $env:GITHUB_OUTPUT
      - name: Sign binaries (if cert provided)
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT)) {
            Write-Host "No se proporciono certificado de firma. Se omite la firma."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CODE_SIGN_CERT))
          $st = "${{ steps.signtool.outputs.path }}"
          Get-ChildItem .\publish\*.exe -ErrorAction SilentlyContinue | ForEach-Object { & $st sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $certPath /p $env:CODE_SIGN_PASSWORD $_.FullName }
          Get-ChildItem .\publish\*.msi -ErrorAction SilentlyContinue | ForEach-Object { & $st sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $certPath /p $env:CODE_SIGN_PASSWORD $_.FullName }
          Remove-Item $certPath -Force

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem .\publish\*.exe | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash + "  " + $_.Name } | Out-File -Encoding ASCII publish/SHA256SUMS.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/*.exe
            publish/SHA256SUMS.txt
